<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AR Nouns</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B2624">
  <link rel="icon" href="icon/icon-192.png">
  <link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AR Nouns">

  <link rel="stylesheet" href="style.css?v=12">

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.8.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar-nft.js"></script>
</head>
<body>

  <div class="top-actions">
    <button class="icon-action-btn" id="fullscreen-btn" type="button" title="Skrin penuh" aria-label="Toggle skrin penuh">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
    <button class="icon-action-btn" id="install-button" type="button" hidden title="Pasang App" aria-label="Pasang app">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
    </button>
    <button class="icon-action-btn" id="update-btn" type="button" title="Kemaskini App" aria-label="Kemaskini app (hard refresh)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
    </button>
  </div>

  <div class="start-screen" id="start-screen">
    <div class="brand">
      <img class="brand-icon" src="icon/icon-192.png" alt="">
      <h1>AR Nouns</h1>
    </div>
    <p>
      Warna gambar dalam lembaran kerja, kemudian halakan kamera ke gambar itu —
      ia akan <strong>"hidup"</strong>! Belajar nama benda dalam tiga bahasa:
      <strong>English</strong>, <strong>Bahasa Melayu</strong>, dan <strong>Bahasa Semai</strong>.
    </p>
    <div class="noun-chip-list" id="noun-chip-list">
      <span class="noun-chip-empty">Memuatkan senarai noun...</span>
    </div>
    <button class="btn" id="start-btn">📷 Mula Imbas</button>
  </div>

  <div class="ar-view" id="ar-view" hidden>
    <div class="ar-frame">
      <div class="arjs-loader" id="arjs-loader">
        <div class="spinner"></div>
        <div class="loader-text">Sedang buka kamera... sila tunggu</div>
      </div>

      <button class="icon-action-btn ar-back-btn" id="back-btn" type="button" title="Kembali" aria-label="Kembali ke menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </button>

      <button class="icon-action-btn ar-camera-toggle-btn" id="camera-toggle-btn" type="button" hidden title="Tukar kamera" aria-label="Tukar kamera">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>

      <div class="scan-hint">Halakan kamera ke gambar yang telah diwarna</div>

      <div id="ar-scene-container"></div>

      <div id="noun-label" class="noun-label">
        <div class="en"></div>
        <div class="bm"></div>
        <div class="semai"></div>
      </div>

      <pre id="debug-panel" class="debug-panel"></pre>

      <div class="tune-panel" id="tune-panel" hidden>
        <div class="tune-row">
          <label for="tune-size">Saiz</label>
          <input type="range" id="tune-size" min="300" max="2200" step="10">
          <span id="tune-size-val"></span>
        </div>
        <div class="tune-row">
          <label for="tune-x">Kiri / Kanan</label>
          <input type="range" id="tune-x" min="-700" max="700" step="5">
          <span id="tune-x-val"></span>
        </div>
        <div class="tune-row">
          <label for="tune-y">Bawah / Atas</label>
          <input type="range" id="tune-y" min="600" max="2000" step="5">
          <span id="tune-y-val"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js?v=12"></script>
</body>
</html>
